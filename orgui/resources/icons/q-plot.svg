<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" version="1.1" id="q-plot">
  <title>Q-plot</title>
  <desc>Momentum transfer: a capital Q.</desc>
  <rect width="32" height="32" rx="3" fill="none"/>
  <!-- The letter is drawn as a filled ring with a tail crossing it, rather
       than as a stroked circle with a handle, which reads as a magnifier.
       Both parts share one colour for the same reason. -->
  <g fill="#4a4a4a">
    <path fill-rule="evenodd" d="M15 4.5 a11 11 0 1 0 0 22 a11 11 0 1 0 0 -22 z M15 10.4 a5.1 5.1 0 1 1 0 10.2 a5.1 5.1 0 1 1 0 -10.2 z"/>
    <line x1="17.6" y1="20.2" x2="24.8" y2="27.4" stroke="#4a4a4a" stroke-width="4.6" stroke-linecap="butt"/>
  </g>
</svg>
