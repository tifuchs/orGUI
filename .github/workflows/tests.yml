name: Tests

"on":
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64 Python 3.10
            os: ubuntu-latest
            python-version: "3.10"
            qt-binding: PyQt5
          - name: Linux x86_64 Python 3.14
            os: ubuntu-latest
            python-version: "3.14"
            qt-binding: PyQt6
          - name: macOS arm64 Python 3.14
            os: macos-14
            python-version: "3.14"
            qt-binding: PyQt6
          - name: Windows x86_64 Python 3.14
            os: windows-latest
            python-version: "3.14"
            qt-binding: PyQt6

    env:
      MPLBACKEND: Agg
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      QT_QPA_PLATFORM: minimal
      QT_API: ${{ matrix.qt-binding }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # Qt itself needs libEGL even under the "minimal" platform plugin. Kept
      # to the one library the runner was missing; widen only if a later run
      # names another.
      - name: Install Qt system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1

      # qtawesome is the silx GUI extra the widgets import at runtime. It is
      # installed on its own rather than through silx[full], which also pulls
      # pyopencl (fails at import on the macOS runner) and PySide6 (which silx
      # would prefer over the binding this leg is meant to exercise).
      - name: Install test dependencies
        run: >-
          python -m pip install --upgrade pip pytest
          qtawesome ${{ matrix.qt-binding }}

      # -Dstatic_xxhash=true matches build-wheels.yml and release.yml. Without
      # it the extensions that depend on xxhash link a shared library that is
      # not installed beside them, and fail to load on Windows.
      - name: Install package
        run: >-
          python -m pip install -C setup-args=-Dstatic_xxhash=true
          ".[speedup,extendedfilesupport,symmetry]"

      # Runs against the installed package, so the compiled extensions under
      # test are the ones that ship. Covers orgui/app, orgui/backend and
      # orgui/datautils/xrayutils rather than a hand-maintained module list.
      - name: Run test suite
        run: pytest --pyargs orgui
