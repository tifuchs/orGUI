name: Tests

"on":
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64 Python 3.10
            os: ubuntu-latest
            python-version: "3.10"
            qt-binding: PyQt5
          - name: Linux x86_64 Python 3.14
            os: ubuntu-latest
            python-version: "3.14"
            qt-binding: PyQt6
          - name: macOS arm64 Python 3.14
            os: macos-14
            python-version: "3.14"
            qt-binding: PyQt6
          - name: Windows x86_64 Python 3.14
            os: windows-latest
            python-version: "3.14"
            qt-binding: PyQt6
            # Force MSVC, as build-wheels.yml and release.yml do. Without it
            # meson can pick a MinGW toolchain from the runner PATH, and the
            # resulting extension needs libstdc++/libgcc/libwinpthread DLLs
            # that Python 3.8+ no longer searches PATH for.
            extra-setup-args: -C setup-args=--vsenv

    env:
      MPLBACKEND: Agg
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      QT_QPA_PLATFORM: minimal
      QT_API: ${{ matrix.qt-binding }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # Qt itself needs libEGL even under the "minimal" platform plugin. Kept
      # to the one library the runner was missing; widen only if a later run
      # names another.
      - name: Install Qt system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1

      # qtawesome and PyOpenGL are the silx GUI extras orgui.app pulls in on
      # import (silx.gui.data.DataViews reaches silx.gui.plot3d, which raises
      # unless PyOpenGL is present). They are installed on their own rather
      # than through silx[full], which also pulls pyopencl (fails at import on
      # the macOS runner) and PySide6 (which silx would prefer over the
      # binding this leg is meant to exercise).
      - name: Install test dependencies
        run: >-
          python -m pip install --upgrade pip pytest
          qtawesome PyOpenGL ${{ matrix.qt-binding }}

      # -Dstatic_xxhash=true matches build-wheels.yml and release.yml.
      # -v is temporary: it prints meson's "C++ compiler for the host machine"
      # line, which is what confirms whether the Windows extension is built
      # with MSVC. Drop it once that is settled.
      - name: Install package
        run: >-
          python -m pip install -v -C setup-args=-Dstatic_xxhash=true
          ${{ matrix.extra-setup-args }}
          ".[speedup,extendedfilesupport,symmetry]"

      # Runs against the installed package, so the compiled extensions under
      # test are the ones that ship. Covers orgui/app, orgui/backend and
      # orgui/datautils/xrayutils rather than a hand-maintained module list.
      - name: Run test suite
        run: pytest --pyargs orgui
