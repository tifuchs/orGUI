[project]
name = 'orGUI'
dynamic = ['version',]
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_LICENSES/*"]
requires-python = '>=3.10'
readme = 'README.rst'
description = 'orGUI: Orientation and Integration with 2D detectors'

authors = [
  { name = 'Timo Fuchs', email = 'tfuchs@cornell.edu' }
]
classifiers = [
    'Development Status :: 5 - Production/Stable',
    'Environment :: Win32 (MS Windows)',
	'Environment :: X11 Applications :: Qt',
    'Intended Audience :: End Users/Desktop',
    'Intended Audience :: Developers',
    'Intended Audience :: Science/Research',
    'Operating System :: MacOS :: MacOS X',
    'Operating System :: Microsoft :: Windows',
    'Operating System :: POSIX',
    'Programming Language :: Python',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: Implementation :: CPython',
    'Topic :: Scientific/Engineering :: Chemistry',
    'Topic :: Scientific/Engineering :: Physics',
    'Topic :: Scientific/Engineering :: Visualization',
    'Topic :: Software Development :: Libraries :: Python Modules'
]

dependencies = [
	'numpy >= 1.17',
	'scipy >= 1.9',
	'matplotlib >= 3.6',
	'fabio >= 0.7',
	'silx >= 1.1',
	# Required at import, not optional: orgui.app imports
	# silx.gui.data.DataViewerFrame, which reaches silx.gui.plot3d (raises
	# without PyOpenGL) and silx.gui.data.Hdf5TableView (imports qtawesome).
	'PyOpenGL',
	'qtawesome',
	'pyFAI >= 2023.3,!=2025.12.0,!=2025.12.1,!=2026.2.0',
	'xraydb >= 4.0',
	'pytz >= 2022'
]

[project.urls]
Homepage = "https://github.com/tifuchs/orGUI"
Source = "https://github.com/tifuchs/orGUI"
Documentation = "https://orgui.readthedocs.io/en/latest/"
Issues = "https://github.com/tifuchs/orGUI/issues"
Changelog = "https://github.com/tifuchs/orGUI/blob/master/CHANGELOG.md"
Citation = "https://doi.org/10.5281/zenodo.12592485"

[project.optional-dependencies]
console = ['qtconsole']
speedup = ['numba']
extendedfilesupport = ['ase', 'hdf5plugin']
reconstruction = ['hdf5plugin']
symmetry = ['pyxtal']
full = ['qtconsole', 'ase', 'numba' , 'PyOpenGL', 'hdf5plugin', 'pyxtal', 'py3Dmol']
full-devel = ['qtconsole', 'ase', 'numba' , 'PyOpenGL', 'hdf5plugin', 'pyxtal', 'py3Dmol', 'ruff', 'pyupgrade']

[build-system]
# pybind11 >= 2.12: the extensions reach NumPy's C API through
# pybind11/numpy.h, which resolves it at runtime rather than at compile time.
# NumPy 2 moved numpy.core to numpy._core, and only 2.12 onwards looks it up
# correctly, so an older pybind11 yields a binary that fails to import under
# NumPy 2.
requires = ["meson-python", "pybind11 >= 2.12", "setuptools-scm>=8", "numpy"]
build-backend = "mesonpy"

[tool.setuptools.packages.find]
where = ["."]  
include = ["orgui*"]  
exclude = ["orgui.datautils.xrayutils.tests*"] 
namespaces = true 

[project.scripts] #
orGUI='orgui.main:main'
orGUI-rsmap='orgui.reconstruction_cli:main'

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
"orgui.resources.icons" = ['*.svg','*.png']
"orgui.datautils.xrayutils.unitcells" = ['*.bul', '*.sur', '*.xtal', '*.xpr']

[tool.setuptools_scm]
version_file = "orgui/_version.py"
fallback_version = "1.5.0+nogit"

[tool.ruff]
# Target Python version for pyupgrade
target-version = "py310"
# Optional: autofix
# fix = true

[tool.ruff.lint]
# Ruff 0.4+ uses this section for rule configuration
# Enable linting for NumPy 2.x deprecations and general cleanup
select = [
    "E", "F", "W",          # Pyflakes / pycodestyle
    "UP",                   # pyupgrade rules
    "NPY",                  # NumPy-specific rules (NumPy 2.x)
]
ignore = [
    # Add ignores here if needed
]
